<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HuddleResilience-App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Tata letak: bingkai ponsel 420px di kanan dan peta fungsi FRAM di kiri pada layar lebar. Satu kolom penuh pada ponsel. */
:root{
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --page:#DCE5EE; --bg:#E9EFF5; --surface:#FFFFFF; --surface-2:#F2F6FA; --line:#D0DBE7;
  --fg:#10253D; --fg-2:#46596F; --fg-3:#62768C;
  --brand:#0E3C72; --on-brand:#FFFFFF; --link:#0E3C72; --focus:#1B7FD0;
  --respons:#B02A62; --respons-bg:#FBE7EF;
  --pantau:#1B68B3; --pantau-bg:#E1EEFA;
  --antisipasi:#6B46B8; --antisipasi-bg:#EDE7FA;
  --belajar:#1A6F47; --belajar-bg:#DFF3E8;
  --good:#1A6F47; --good-bg:#DFF3E8;
  --warn:#855A00; --warn-bg:#FBF0D3;
  --crit:#B3261E; --crit-bg:#FBE4E1;
  --shadow:0 18px 50px rgba(8,25,48,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#060D16; --bg:#0A1420; --surface:#112033; --surface-2:#16293F; --line:#27425F;
    --fg:#E8F0F8; --fg-2:#A7BAD0; --fg-3:#8CA0B6;
    --brand:#1F63B0; --on-brand:#FFFFFF; --link:#8CC4F5; --focus:#8CC4F5;
    --respons:#F08FB6; --respons-bg:#3B1527;
    --pantau:#8DBDF0; --pantau-bg:#112E4E;
    --antisipasi:#B9A0F2; --antisipasi-bg:#2A1E4A;
    --belajar:#6FD0A0; --belajar-bg:#11382A;
    --good:#6FD0A0; --good-bg:#11382A;
    --warn:#EBC15A; --warn-bg:#3A2D0B;
    --crit:#FF8F86; --crit-bg:#431A17;
    --shadow:0 18px 50px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#060D16; --bg:#0A1420; --surface:#112033; --surface-2:#16293F; --line:#27425F;
  --fg:#E8F0F8; --fg-2:#A7BAD0; --fg-3:#8CA0B6;
  --brand:#1F63B0; --on-brand:#FFFFFF; --link:#8CC4F5; --focus:#8CC4F5;
  --respons:#F08FB6; --respons-bg:#3B1527;
  --pantau:#8DBDF0; --pantau-bg:#112E4E;
  --antisipasi:#B9A0F2; --antisipasi-bg:#2A1E4A;
  --belajar:#6FD0A0; --belajar-bg:#11382A;
  --good:#6FD0A0; --good-bg:#11382A;
  --warn:#EBC15A; --warn-bg:#3A2D0B;
  --crit:#FF8F86; --crit-bg:#431A17;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}

/* Rangka */
.stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.app{position:relative;display:flex;flex-direction:column;height:100%;min-height:560px;background:var(--bg);overflow:hidden;width:100%;max-width:560px;margin:0 auto}
.side{display:none}
@media (min-width:960px){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:48px;max-width:1120px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .app{height:min(100%,860px);max-width:none;margin:0;border-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow);align-self:start}
  .side{display:block;overflow:auto;max-height:100%;padding-right:6px}
  .ib-map{display:none!important}
}

/* Header */
.hd{flex:none;background:var(--brand);color:var(--on-brand)}
.hd-in{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hd-text{min-width:0}
.hd-ctx{font-size:13px;opacity:.88}
.hd h1{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.15;margin-top:3px;text-wrap:balance}
.hd-btns{display:flex;gap:8px;flex:none}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.24)}
.hd :focus-visible{outline-color:#fff}
#timer.over{color:#FFD27A;font-weight:700}

/* Isi */
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.screen{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;bottom:0;margin-top:auto;padding-block:14px 12px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(to top,var(--bg) 78%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card.plain{background:transparent;border-style:dashed}
.sec-t{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin-bottom:8px}
.sub{font-size:13px;color:var(--fg-2)}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--good-bg);color:var(--good)}
.note.info{background:var(--pantau-bg);color:var(--pantau)}

/* Pil, kode fungsi */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.3;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-crit{background:var(--crit-bg);color:var(--crit)}
.p-mute{background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.p-respons{background:var(--respons-bg);color:var(--respons)}
.p-pantau{background:var(--pantau-bg);color:var(--pantau)}
.p-antisipasi{background:var(--antisipasi-bg);color:var(--antisipasi)}
.p-belajar{background:var(--belajar-bg);color:var(--belajar)}
.fn{display:inline-block;font:600 12px var(--f-mono);padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.fn.on{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.res.mid .fn.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}

/* Daftar kunci-nilai */
.kv{margin:0;display:grid}
.kv>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv>div:first-child{border-top:0;padding-top:2px}
.kv dt{color:var(--fg-2)}
.kv dd{margin:0;font-weight:700;text-align:right}

/* Tombol */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;width:100%;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:16px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-sec{background:var(--surface);color:var(--link);border-color:var(--link)}
.btn-ghost{background:transparent;color:var(--link);width:auto;min-height:44px;font-size:14px;padding:0 10px}
.btn-sm{width:auto;min-height:44px;font-size:14px;padding:0 14px;border-radius:12px}
.btn-warn{background:var(--surface);color:var(--crit);border-color:var(--crit)}

/* Baris tindakan dan daftar */
.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;min-height:52px}
.rowbtn:first-of-type{border-top:0}
.rowbtn b{display:block}
.rowbtn small{display:block;color:var(--fg-2);font-size:12.5px}

/* Stepper */
.stp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.stp:first-of-type{border-top:0;padding-top:2px}
.stp-l{flex:1;min-width:0}
.stp-c{display:flex;align-items:center;gap:6px}
.stp-b{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.stp-b:disabled{opacity:.4;cursor:not-allowed}
.stp-v{min-width:46px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}

/* Gauge beban */
.score{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.score b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.gauge{position:relative;height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.gauge-f{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.gauge-f.ok{background:var(--belajar)}
.gauge-f.over{background:var(--warn)}
.gauge-m{position:absolute;top:-5px;bottom:-5px;left:50%;width:3px;margin-left:-1px;border-radius:2px;background:var(--fg)}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);margin-top:6px}

/* Toggle isian dan bed */
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:8px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.tog:first-of-type{border-top:0}
.bed{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.bed:first-of-type{border-top:0}
.bed-n{font-weight:600;min-width:52px}
.bed-d{flex:1;min-width:140px;display:flex;flex-direction:column;font-size:12.5px;color:var(--fg-2)}
.bed-d b{color:var(--fg);font-size:14.5px}
.tog small{display:block;color:var(--fg-2);font-size:12.5px;font-weight:400}

/* Resonance Alert */
.res{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.res.hot{background:var(--crit-bg);color:var(--crit)}
.res.mid{background:var(--warn-bg);color:var(--warn)}
.res-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res h2{font-family:var(--f-display);font-size:18px;line-height:1.2}
.res .tag{margin-left:auto;font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.res p{color:var(--fg);font-size:14px}
.res .res-n{font-size:12.5px;color:var(--fg-2)}
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.chain .grp{display:inline-flex;gap:3px}
.chain .arw{color:var(--fg-3);font-size:18px;line-height:1}

/* Agenda */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg button{min-height:44px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.q{display:flex;flex-direction:column;gap:8px}
.q.done{border-color:var(--good)}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.q-fns{display:flex;gap:4px;flex-wrap:wrap}
.q h3{font-family:var(--f-display);font-size:17px;line-height:1.3;font-weight:700;text-wrap:balance}
.q-why{font-size:13px;color:var(--fg-2)}
.q-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q-chk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px}
.q-chk[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.vrow{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip.sm{min-height:38px;font-size:13px;padding:0 12px}

/* Tindakan */
.act{display:flex;flex-direction:column;gap:6px}
.act-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.act h3{font-family:var(--f-display);font-size:16.5px;line-height:1.3;font-weight:700;min-width:0}
.act.selesai h3{text-decoration:line-through;color:var(--fg-2)}
.meta{font-size:13px;color:var(--fg-2)}
.act-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}

/* Formulir */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label,.lbl{font-weight:700;font-size:14px}
.fld small{color:var(--fg-2);font-size:12.5px}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{min-height:104px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--crit);font-size:13.5px;min-height:1.2em;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:700}
.chk input{width:22px;height:22px}

/* Tren */
.brow{display:grid;grid-template-columns:112px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:5px 0}
.brow span:first-child{font-size:13.5px}
.btrack{height:16px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.btrack i{display:block;height:100%;background:var(--brand);border-radius:5px}
.brow .n{text-align:right;font-weight:600;font-size:13px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.mini b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.mini span{font-size:13px;color:var(--fg-2)}
.stack{display:flex;height:18px;border-radius:6px;overflow:hidden;gap:2px}
.stack span{display:block;min-width:4px}
.s-respons{background:var(--respons)}.s-pantau{background:var(--pantau)}.s-antisipasi{background:var(--antisipasi)}.s-belajar{background:var(--belajar)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.pbar{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--belajar)}
.prow{padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .top{display:flex;justify-content:space-between;gap:10px}
.prow .top b{font-variant-numeric:tabular-nums}

/* Praktik baik */
.gitem{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.gitem:first-of-type{border-top:0;padding-top:0}
.gitem p{font-size:14.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* Navigasi */
.nav{flex:none;background:var(--surface);border-top:1px solid var(--line)}
.nav-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 2px;border:0;background:none;color:var(--fg-2);font-size:11.5px;font-weight:700}
.nav button[aria-current="page"]{color:var(--link);box-shadow:inset 0 3px 0 var(--link)}

/* Lembar bawah */
.sheet-wrap{position:absolute;inset:0;z-index:20;background:rgba(5,14,26,.55);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:90%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-top:10px;padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-size:20px;margin-bottom:12px}
.sheet h2:focus{outline:none}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;text-align:center}
.prev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:12px}
.prev b{font-family:var(--f-display);font-size:26px}
.cal{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px}

/* Peta FRAM */
.fmap{width:100%;height:auto;display:block}
.nd polygon{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.nd.fl polygon{fill:var(--warn-bg);stroke:var(--warn)}
.nd.hot polygon{fill:var(--crit-bg);stroke:var(--crit)}
.nd.cur polygon{stroke:var(--link);stroke-width:4}
.nd-c{font:600 14px var(--f-mono);fill:var(--fg);text-anchor:middle}
.nd-n{font:400 12.5px var(--f-body);fill:var(--fg-2);text-anchor:middle}
.ed{stroke:var(--fg-3);stroke-width:2;fill:none}
.ed.dash{stroke-dasharray:5 5}
.ed.hot{stroke:var(--crit);stroke-width:3.5}
.hd-tip{fill:var(--fg-3)}
.hd-tip.hot{fill:var(--crit)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--fg-2);margin-top:8px}
.mlegend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:2px solid var(--line)}
.mlegend .l-fl{background:var(--warn-bg);border-color:var(--warn)}
.mlegend .l-hot{background:var(--crit-bg);border-color:var(--crit)}
.mlegend .l-cur{background:var(--surface-2);border-color:var(--link)}

/* Kolom kiri */
.side-in{display:flex;flex-direction:column;gap:16px;padding-block:6px 20px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.side h2{font-family:var(--f-display);font-size:34px;line-height:1.08;font-weight:700;text-wrap:balance;margin-top:4px}
.side p{color:var(--fg-2);max-width:60ch}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pots div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--fg-2)}
.pots b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="stage">
  <aside class="side" id="side" aria-label="Penjelasan prototipe"></aside>
  <div class="app" id="app">
    <header class="hd">
      <div class="hd-in">
        <div class="hd-text"><div class="hd-ctx" id="hd-ctx"></div><h1 id="hd-title">Beranda shift</h1></div>
        <div class="hd-btns">

<script>
(function(){
'use strict';

/* ---------- Konstanta ---------- */
const KEY='huddleresilience-proto-v2';
const SHIFTS=['Pagi','Siang','Malam'];
const FN={F1:'Timbang terima',F2:'Beban',F3:'Risiko',F4:'Huddle',F5:'Tindakan',F6:'Tindak lanjut',F7:'Praktik baik',F8:'Pola unit'};
const POT={respons:'Respons',pantau:'Pantau',antisipasi:'Antisipasi',belajar:'Belajar'};
const VARS=['Terlalu awal','Terlalu lambat','Tidak dilakukan','Tidak akurat'];
const OWNERS=['Ketua tim','PJ shift','Perawat zona merah','Perawat zona kuning','Perawat pelaksana','Kepala IGD'];
const CATS=['Komunikasi','Pembagian tugas','Peralatan','Pemantauan','Eskalasi'];
const CTXS=['Beban tinggi','Staf kurang','Pasien datang bersamaan','Alat terbatas'];
const TITLES={beranda:'Beranda shift',beban:'Beban dan kapasitas',agenda:'Agenda huddle',tindakan:'Papan tindakan',praktik:'Catat praktik baik',tren:'Tren unit'};
const SCREEN_FN={beranda:[],beban:['F1','F2','F3'],agenda:['F4'],tindakan:['F5','F6'],praktik:['F7'],tren:['F8']};
const RES_TXT={F1:'timbang terima tidak lengkap',F2:'beban melewati ambang',F6:'tindakan tertahan'};

/* ---------- Ikon ---------- */
const IC={
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  list:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.2 1.2L7.5 5M4 12l1.2 1.2L7.5 11M4 18l1.2 1.2L7.5 17"/>',
  task:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 14l2 2 4-4"/>',
  leaf:'<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/>',
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  map:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l8 1M7 8l4 8M17 10l-4 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>'
};
const ico=(n,s)=>`<svg width="${s||22}" height="${s||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- Utilitas ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const f1=n=>n.toFixed(1).replace('.',',');
const pad=n=>String(n).padStart(2,'0');
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);
const uid=p=>p+Math.random().toString(36).slice(2,8);
const uniq=a=>Array.from(new Set(a));
const sortFn=a=>a.slice().sort((x,y)=>x.localeCompare(y));
const pill=(t,c)=>`<span class="pill p-${c}">${esc(t)}</span>`;
const listId=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+', dan '+a[a.length-1];
const TTL=/^(Tn|Ny|Nn|An|Sdr|Sdri|Bpk|Ibu)\.?\s+/;
const initials=n=>n.replace(TTL,'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('.').toUpperCase()+'.';
const nmShow=n=>S.mask?initials(n||''):(n||'');
const rmShow=m=>S.mask?'***'+String(m||'').slice(-3):(m||'');
const pTxt=b=>`${b.name} (${nmShow(b.nm)}, RM ${rmShow(b.rm)})`;
function looksId(t){
  const l=t.toLowerCase();
  if(/\b(Tn|Ny|Nn|Sdr|Sdri|Bpk|Bapak|Ibu|Pak|Bu)\.?\s+[A-Z][a-z]{2,}/.test(t)||/\d{6,}/.test(t))return true;
  return S.beds.some(b=>(b.rm&&l.includes(b.rm.toLowerCase()))||String(b.nm||'').replace(TTL,'').split(/\s+/).some(w=>w.length>=4&&l.includes(w.toLowerCase())));
}

/* ---------- Data awal (contoh, bukan data pasien) ---------- */
function shiftNow(){const h=new Date().getHours();return h>=7&&h<14?0:(h>=14&&h<21?1:2);}
function seed(){
  return{
    tab:'beranda',shift:shiftNow(),threshold:4,mask:false,
    load:{pasien:14,tinggi:4,perawat:5},
    handover:[
      {id:'h1',label:'Kondisi pasien per bed',ok:true},
      {id:'h2',label:'Rencana tindakan',ok:true},
      {id:'h3',label:'Bed 7: pemantauan',ok:false},
      {id:'h4',label:'Terapi dan alat terpasang',ok:true},
      {id:'h5',label:'Hasil penunjang tertunda',ok:false}
    ],
    beds:[
      {id:'b1',name:'Bed 1',nm:'Ny. Sari Lestari',rm:'01-24-3318',rr:16,spo2:97,o2:false,sbp:126,hr:76,alert:true,temp:36.7},
      {id:'b2',name:'Bed 2',nm:'Tn. Agus Pratama',rm:'01-24-3320',rr:18,spo2:96,o2:false,sbp:118,hr:84,alert:true,temp:37.0},
      {id:'b4',name:'Bed 4',nm:'Tn. Hendra Wijaya',rm:'01-23-9871',rr:22,spo2:95,o2:false,sbp:104,hr:108,alert:true,temp:38.2},
      {id:'b7',name:'Bed 7',nm:'Ny. Maya Kusuma',rm:'01-24-3295',rr:20,spo2:94,o2:false,sbp:118,hr:96,alert:true,temp:37.2},
      {id:'b9',name:'Bed 9',nm:'An. Rafi Ananda',rm:'01-24-3301',rr:18,spo2:96,o2:false,sbp:112,hr:92,alert:true,temp:38.3}
    ],
    actions:[
      {id:'a1',title:'Nilai ulang Bed 4',pid:'b4',owner:'Perawat zona merah',due:'06:30',status:'terbuka',carry:1},
      {id:'a2',title:'Lengkapi isian Bed 7',pid:'b7',owner:'Perawat pelaksana',due:'08:00',status:'terbuka',carry:1},
      {id:'a3',title:'Cek ketersediaan alat',owner:'Ketua tim',due:'09:00',status:'eskalasi',carry:2}
    ],
    huddle:{mode:'standar',startedAt:null,finishedAt:null,duration:0,done:{},marks:{}},
    good:[],
    hist:{shifts:84,docShifts:62,flags:{F1:11,F2:18,F3:6,F4:4,F5:3,F6:14,F7:5,F8:7},
      marks:{'Terlalu awal':4,'Terlalu lambat':21,'Tidak dilakukan':9,'Tidak akurat':7},
      pot:{respons:19,pantau:33,antisipasi:14,belajar:12},
      actionsTotal:73,actionsClosed:58,good:22,recent:[true,true,false]}
  };
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===2&&o.s&&o.s.hist&&o.s.beds&&o.s.huddle)return o.s;}}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:2,s:S}));}catch(e){}}
let S=load();
const UI={sheet:null,varOpen:{},draft:{cat:'',ctx:[],text:'',err:''},confirmReset:false};

/* ---------- Logika ---------- */
function news2(b){
  const rr=b.rr,sp=b.spo2,sb=b.sbp,hr=b.hr,t=b.temp;
  const a=[
    rr<=8?3:rr<=11?1:rr<=20?0:rr<=24?2:3,
    sp<=91?3:sp<=93?2:sp<=95?1:0,
    b.o2?2:0,
    sb<=90?3:sb<=100?2:sb<=110?1:sb<=219?0:3,
    hr<=40?3:hr<=50?1:hr<=90?0:hr<=110?1:hr<=130?2:3,
    b.alert?0:3,
    t<=35?3:t<=36?1:t<=38?0:t<=39?1:2
  ];
  const total=a.reduce((x,y)=>x+y,0),single=a.some(x=>x===3);
  const level=total>=7?'tinggi':(total>=5||single)?'sedang':'rendah';
  return{total,single,level,flag:level!=='rendah'};
}
const LVL={rendah:['Rendah','good','Pantau rutin'],sedang:['Sedang','warn','Perlu dinilai ulang'],tinggi:['Tinggi','crit','Perlu respons segera']};
function loadScore(){const l=S.load;return(l.pasien+2*l.tinggi)/Math.max(1,l.perawat);}
function ctx(){
  const sc=loadScore(),h=S.hist.recent,n=h.length;
  return{
    sc,overLoad:sc>S.threshold,
    missing:S.handover.filter(x=>!x.ok),
    open:S.actions.filter(a=>a.status!=='selesai'),
    stuck:S.actions.filter(a=>a.status==='eskalasi'||(a.status==='terbuka'&&a.carry>=2)),
    risky:S.beds.map(b=>({b,n:news2(b)})).filter(x=>x.n.flag).sort((x,y)=>y.n.total-x.n.total),
    noDoc:n>=2&&!h[n-1]&&!h[n-2]
  };
}
function resonance(c){
  const act=[];
  if(c.missing.length)act.push('F1');
  if(c.overLoad)act.push('F2');
  if(c.stuck.length)act.push('F6');
  if(act.length<2)return null;
  const hazard=c.risky.length>0;
  return{act,hazard,level:(act.length===3||hazard)?'tinggi':'waspada'};
}
function questions(){
  const c=ctx(),res=resonance(c),q=[];
  if(res)q.push({id:'q-res',pri:0,pot:'antisipasi',fns:uniq(res.act.concat(['F3'])),
    text:'Variasi mana yang bisa kita kurangi sekarang, supaya tidak saling menguatkan?',
    why:'Muncul bersamaan: '+listId(res.act.map(f=>RES_TXT[f])),act:'Kurangi variasi yang muncul bersamaan'});
  if(c.risky.length){const nm=c.risky.map(x=>x.b.name).join(', ');
    q.push({id:'q-det',pri:1,pot:'antisipasi',fns:['F3','F4'],text:`Siapa yang menilai ulang ${nm}, dan kapan?`,
    why:c.risky.map(x=>`NEWS2 ${pTxt(x.b)} = ${x.n.total}`).join('; '),act:`Nilai ulang ${nm}`,pid:c.risky[0].b.id});}
  if(c.overLoad)q.push({id:'q-load',pri:2,pot:'respons',fns:['F2','F4'],text:'Siapa cadangan jika dua pasien memburuk bersamaan?',
    why:`Skor beban ${f1(c.sc)} melewati ambang ${f1(S.threshold)}`,act:'Siapkan cadangan staf'});
  if(c.missing.length)q.push({id:'q-hand',pri:3,pot:'pantau',fns:['F1','F3'],text:'Informasi apa yang belum kita dapat untuk pasien ini?',
    why:`${c.missing.length} isian timbang terima kosong: ${c.missing.map(h=>h.label).join(', ')}`,act:'Lengkapi isian timbang terima'});
  if(c.open.length)q.push({id:'q-open',pri:4,pot:'pantau',fns:['F6'],text:'Tindakan mana yang belum selesai, dan siapa pemiliknya sekarang?',
    why:`${c.open.length} tindakan terbuka`+(c.stuck.length?`, ${c.stuck.length} perlu eskalasi`:''),act:'Tinjau tindakan yang belum selesai'});
  if(c.noDoc)q.push({id:'q-doc',pri:5,pot:'belajar',fns:['F8'],text:'Hambatan apa yang membuat huddle tidak terjadi?',
    why:'Huddle tidak terdokumentasi dua shift berturut-turut',act:'Atasi hambatan pelaksanaan huddle'});
  if(S.good.length)q.push({id:'q-good',pri:6,pot:'belajar',fns:['F7','F8'],text:'Penyesuaian apa yang berhasil dan layak diulang?',
    why:`${S.good.length} praktik baik tercatat shift ini`,act:'Ulangi praktik baik yang berhasil'});
  q.push({id:'q-base',pri:9,pot:'antisipasi',fns:['F4'],text:'Apa yang paling mungkin tidak berjalan sesuai rencana di shift ini?',
    why:'Pertanyaan dasar setiap huddle',act:'Siapkan antisipasi risiko shift'});
  return q.sort((a,b)=>a.pri-b.pri);
}
function agendaList(){const all=questions();return S.huddle.mode==='ringkas'?all.slice(0,3):all;}
function flagged(){return sortFn(uniq(questions().filter(q=>q.id!=='q-base').reduce((a,q)=>a.concat(q.fns),[])));}

function trend(){
  const H=S.hist,flags=Object.assign({},H.flags),marks=Object.assign({},H.marks),pot=Object.assign({},H.pot);
  flagged().forEach(f=>flags[f]=(flags[f]||0)+1);
  Object.keys(S.huddle.marks).forEach(k=>{const m=S.huddle.marks[k];if(m)marks[m]=(marks[m]||0)+1;});
  questions().forEach(q=>{if(S.huddle.done[q.id])pot[q.pot]=(pot[q.pot]||0)+1;});
  const total=H.actionsTotal+S.actions.filter(a=>a.carry===0).length;
  const closed=H.actionsClosed+S.actions.filter(a=>a.status==='selesai'||(a.status==='eskalasi'&&!a.counted)).length;
  const shifts=H.shifts+1,doc=H.docShifts+(S.huddle.finishedAt?1:0);
  return{flags,marks,pot,total,closed,shifts,doc,good:H.good+S.good.length};
}

/* ---------- Layar ---------- */
function resCard(res){
  const hot=res.level==='tinggi',word={2:'Dua',3:'Tiga'}[res.act.length];
  const nodes=[['F1','F2'],['F3'],['F4'],['F5'],['F6']].map(g=>'<span class="grp">'+g.map(f=>`<span class="fn ${res.act.includes(f)?'on':''}">${f}</span>`).join('')+'</span>').join('<span class="arw" aria-hidden="true">&rsaquo;</span>');
  return `<section class="res ${hot?'hot':'mid'}" aria-label="Resonance Alert">
    <div class="res-h">${ico('alert',20)}<h2>${hot?'Resonansi tinggi':'Waspada resonansi'}</h2><span class="tag">Jalur hipotetis</span></div>
    <p>${word} variasi muncul bersamaan: ${listId(res.act.map(f=>RES_TXT[f]))}.${res.hazard?' Ada pasien dengan tanda perburukan, sehingga dampaknya lebih besar.':''}</p>
    <div class="chain" aria-label="Jalur dari F1 dan F2 ke F6">${nodes}</div>
    <p class="res-n">Menurut model, F1 dan F2 bertemu di F3, lalu merambat ke F4, F5, dan F6. Jalur ini masih hipotesis.</p>
  </section>`;
}
function stPill(s){return s==='selesai'?pill('Selesai','good'):s==='eskalasi'?pill('Eskalasi','crit'):pill('Terbuka','warn');}

function scBeranda(){
  const c=ctx(),res=resonance(c),fl=flagged(),ok=S.handover.filter(h=>h.ok).length;
  const hs=S.huddle.finishedAt?pill('Terdokumentasi','good'):S.huddle.startedAt?pill('Berjalan','pantau'):pill('Belum dimulai','warn');
  const lp=pill(`${f1(c.sc)} dari ${f1(S.threshold)}`,c.overLoad?'warn':'good');
  const open=S.actions.filter(a=>a.status!=='selesai');
  const lbl=S.huddle.finishedAt?'Lihat agenda':S.huddle.startedAt?'Lanjutkan huddle':'Mulai huddle';
  return `${res?resCard(res):''}
  <section class="card"><h2 class="sec-t">Status huddle</h2>
    <dl class="kv">
      <div><dt>Huddle shift ini</dt><dd>${hs}</dd></div>
      <div><dt>Isian timbang terima</dt><dd>${ok} dari ${S.handover.length} lengkap</dd></div>
      <div><dt>Skor beban (ambang)</dt><dd>${lp}</dd></div>
      <div><dt>Fungsi ditandai</dt><dd>${pill(fl.length+' fungsi',fl.length?'warn':'good')}</dd></div>
    </dl>
  </section>
  <section class="card"><h2 class="sec-t">Tindakan terbuka dari shift sebelumnya</h2>
    ${open.length?open.map(a=>`<button class="rowbtn" data-act="go" data-tab="tindakan"><span><b>${esc(a.title)}</b><small>${esc(a.owner)}${a.carry?' | terbawa '+a.carry+' shift':''}</small></span>${stPill(a.status)}</button>`).join(''):'<p class="sub">Tidak ada tindakan terbuka. Timbang terima bersih.</p>'}
  </section>
  <section class="card plain"><p class="sub">Untuk demo: akhiri shift ini dan lihat tindakan terbuka terbawa ke timbang terima berikutnya.</p>
    <button class="btn btn-ghost" data-act="endshift">Akhiri shift (demo)</button></section>
  <div class="bar">
    <button class="btn btn-primary" data-act="start">${lbl}</button>
    <button class="btn btn-sec" data-act="go" data-tab="beban">Isi beban dan kapasitas</button>
  </div>`;
}

function scBeban(){
  const sc=loadScore(),over=sc>S.threshold,pct=clamp(sc/(S.threshold*2)*100,2,100),l=S.load;
  const stp=(k,lab,mn,mx)=>`<div class="stp"><div class="stp-l">${lab}</div><div class="stp-c">
    <button class="stp-b" data-act="step" data-k="${k}" data-d="-1" aria-label="Kurangi ${lab}" ${l[k]<=mn?'disabled':''}>${ico('minus')}</button>
    <span class="stp-v" aria-live="polite">${l[k]}</span>
    <button class="stp-b" data-act="step" data-k="${k}" data-d="1" aria-label="Tambah ${lab}" ${l[k]>=mx?'disabled':''}>${ico('plus')}</button></div></div>`;
  const ok=S.handover.filter(h=>h.ok).length;
  const beds=S.beds.map(b=>({b,n:news2(b)})).sort((x,y)=>y.n.total-x.n.total);
  return `<section class="card"><h2 class="sec-t">Beban shift</h2>
    ${stp('pasien','Pasien di IGD',1,99)}${stp('tinggi','Pasien tingkat kegawatan tinggi',0,l.pasien)}${stp('perawat','Perawat bertugas',1,40)}
  </section>
  <section class="card"><h2 class="sec-t">Skor beban</h2>
    <div class="score"><b>${f1(sc)}</b><span class="sub">Ambang rumah sakit ${f1(S.threshold)}</span></div>
    <div class="gauge" role="img" aria-label="Skor beban ${f1(sc)} dari ambang ${f1(S.threshold)}"><div class="gauge-f ${over?'over':'ok'}" style="width:${pct}%"></div><div class="gauge-m"></div></div>
    <div class="gauge-l"><span>0</span><span>Ambang ${f1(S.threshold)}</span><span>${f1(S.threshold*2)}</span></div>
    <p class="note ${over?'':'ok'}" style="margin-top:12px">${over?'Penanda beban aktif. Beban melewati ambang yang ditetapkan rumah sakit. Aplikasi menambahkan pertanyaan cadangan staf ke agenda.':'Beban di bawah ambang. Tidak ada pertanyaan tambahan dari beban.'}</p>
  </section>
  <section class="card"><h2 class="sec-t">Isian timbang terima (${ok} dari ${S.handover.length})</h2>
    ${S.handover.map(h=>`<button class="tog" data-act="hand" data-id="${h.id}" aria-pressed="${h.ok}"><span>${esc(h.label)}</span>${h.ok?pill('Lengkap','good'):pill('Kosong','warn')}</button>`).join('')}
  </section>
  <section class="card"><h2 class="sec-t">Papan risiko pasien</h2>
    ${beds.map(({b,n})=>`<div class="bed"><span class="mono bed-n">${esc(b.name)}</span><span class="bed-d"><b>${esc(nmShow(b.nm))}</b><span>RM <span class="mono">${esc(rmShow(b.rm))}</span> | ${LVL[n.level][2]}</span></span>${pill('NEWS2 '+n.total,LVL[n.level][1])}<button class="btn btn-ghost btn-sm" data-act="bed" data-id="${b.id}" aria-label="Ubah tanda vital ${esc(b.name)}">Ubah</button></div>`).join('')}
    <button class="btn btn-ghost" data-act="addbed">${ico('plus',18)} Tambah pasien berisiko</button>
    <p class="sub" style="margin-top:6px">Skor mengikuti NEWS2 (Royal College of Physicians, 2017). Identitas tampil sesuai kebijakan rumah sakit. Nama dan nomor RM di prototipe ini fiktif. Tindak lanjut klinis mengikuti kebijakan rumah sakit.</p>
  </section>
  <div class="bar"><button class="btn btn-primary" data-act="go" data-tab="agenda">Simpan dan lanjut</button></div>`;
}

function scAgenda(){
  const c=ctx(),res=resonance(c),list=agendaList(),H=S.huddle,done=list.filter(q=>H.done[q.id]).length,all=done===list.length;
  const q=list.map(x=>{
    const isDone=!!H.done[x.id],mk=H.marks[x.id],open=!!UI.varOpen[x.id];
    return `<article class="card q ${isDone?'done':''}">
      <div class="q-top">${pill(POT[x.pot],x.pot)}<span class="q-fns">${x.fns.map(f=>`<span class="fn" title="${FN[f]}">${f}</span>`).join('')}</span></div>
      <h3>${esc(x.text)}</h3>
      <p class="q-why">Muncul karena: ${esc(x.why)}</p>
      <div class="q-act">

const NODES={F1:[58,56],F2:[58,176],F3:[170,116],F4:[282,116],F5:[394,116],F6:[394,236],F7:[282,236],F8:[170,236]};
const EDGES=[['F1','F3'],['F2','F3'],['F3','F4'],['F4','F5'],['F5','F6'],['F6','F7'],['F7','F8'],['F8','F4']];
const PATHE=['F1F3','F2F3','F3F4','F4F5','F5F6'];
function hexPts(cx,cy,r){const p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function edgeSvg(a,b,hot,dash){
  const[x1,y1]=NODES[a],[x2,y2]=NODES[b],dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;
  const sx=x1+ux*33,sy=y1+uy*33,ex=x2-ux*34,ey=y2-uy*34,bx=ex-ux*9,by=ey-uy*9;
  return `<line class="ed ${hot?'hot':''} ${dash?'dash':''}" x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/>`+
   `<polygon class="hd-tip ${hot?'hot':''}" points="${ex.toFixed(1)},${ey.toFixed(1)} ${(bx-uy*5).toFixed(1)},${(by+ux*5).toFixed(1)} ${(bx+uy*5).toFixed(1)},${(by-ux*5).toFixed(1)}"/>`;
}
function mapSvg(){
  const fl=flagged(),res=resonance(ctx()),hotN=res?uniq(res.act.concat(['F3'])):[],cur=SCREEN_FN[S.tab]||[];
  const edges=EDGES.map(([a,b])=>edgeSvg(a,b,!!res&&PATHE.includes(a+b),a==='F8')).join('');
  const nodes=Object.keys(NODES).map(f=>{const[x,y]=NODES[f];
    const cls=['nd',hotN.includes(f)?'hot':fl.includes(f)?'fl':'',cur.includes(f)?'cur':''].join(' ');
    return `<g class="${cls}"><polygon points="${hexPts(x,y,30)}"/><text class="nd-c" x="${x}" y="${y+5}">${f}</text><text class="nd-n" x="${x}" y="${y+46}">${FN[f]}</text></g>`;}).join('');
  return `<svg class="fmap" viewBox="0 0 452 300" role="img" aria-label="Peta delapan fungsi FRAM huddle IGD. Fungsi ditandai: ${fl.length?fl.join(', '):'tidak ada'}."><title>Peta fungsi FRAM huddle IGD</title>${edges}${nodes}</svg>
  <div class="mlegend"><span><i class="l-fl"></i>Fungsi ditandai</span><span><i class="l-hot"></i>Jalur resonansi</span><span><i class="l-cur"></i>Layar aktif</span></div>`;
}

const NAV=[['beranda','Beranda','home'],['agenda','Agenda','list'],['tindakan','Tindakan','task'],['praktik','Praktik baik','leaf'],['tren','Tren','chart']];
function render(keep){
  const m=$('#main'),top=keep?m.scrollTop:0;
  $('#hd-ctx').innerHTML=ctxLine();
  $('#hd-title').textContent=TITLES[S.tab];
  $('#screen').innerHTML=SCREENS[S.tab]();
  m.scrollTop=top;
  const act=S.tab==='beban'?'beranda':S.tab;
  $('#nav').innerHTML=NAV.map(([k,l,i])=>`<button data-act="go" data-tab="${k}" ${k===act?'aria-current="page"':''}>${ico(i,22)}<span>${l}</span></button>`).join('');
  renderSide();tick();
  if(UI.sheet&&(UI.sheet.kind==='settings'||UI.sheet.kind==='map'))paintSheet();
}
function commit(keep){save();render(keep!==false);}
function tick(){
  const el=$('#timer');if(!el)return;const H=S.huddle;
  const s=H.finishedAt?H.duration:H.startedAt?Math.floor((Date.now()-H.startedAt)/1000):0;
  el.textContent=mmss(s);el.classList.toggle('over',s>(H.mode==='ringkas'?300:600));
}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2400);}

/* ---------- Ringkasan ---------- */
function buildExport(){
  const c=ctx(),res=resonance(c),T=trend(),a=S.actions;
  return ['Ringkasan HuddleResilience-App (data contoh)',
    `Unit: IGD | Shift ${SHIFTS[S.shift]}`,
    `Skor beban: ${f1(c.sc)} (ambang ${f1(S.threshold)})`,
    `Timbang terima lengkap: ${S.handover.filter(h=>h.ok).length} dari ${S.handover.length}`,
    `Fungsi ditandai: ${flagged().map(f=>f+' '+FN[f]).join(', ')||'tidak ada'}`,
    `Resonance Alert: ${res?(res.level==='tinggi'?'Resonansi tinggi':'Waspada')+' ('+res.act.join(', ')+')':'tidak aktif'}`,
    `Tindakan: ${a.filter(x=>x.status==='terbuka').length} terbuka, ${a.filter(x=>x.status==='selesai').length} selesai, ${a.filter(x=>x.status==='eskalasi').length} eskalasi`,
    `Huddle terdokumentasi: ${Math.round(T.doc/T.shifts*100)}%`,
    `Tindakan selesai atau eskalasi: ${Math.round(T.closed/Math.max(1,T.total)*100)}%`,
    'Tanpa peringkat individu dan tanpa identitas pasien.'].join('\n');
}

/* ---------- Pergantian shift ---------- */
function endShift(){
  const H=S.hist,fl=flagged(),T=S.huddle;
  fl.forEach(f=>H.flags[f]=(H.flags[f]||0)+1);
  Object.keys(T.marks).forEach(k=>{const m=T.marks[k];if(m)H.marks[m]=(H.marks[m]||0)+1;});
  questions().forEach(q=>{if(T.done[q.id])H.pot[q.pot]=(H.pot[q.pot]||0)+1;});
  H.shifts++;if(T.finishedAt)H.docShifts++;
  H.recent.push(!!T.finishedAt);while(H.recent.length>6)H.recent.shift();
  H.actionsTotal+=S.actions.filter(a=>a.carry===0).length;
  H.actionsClosed+=S.actions.filter(a=>a.status==='selesai'||(a.status==='eskalasi'&&!a.counted)).length;
  H.good+=S.good.length;
  const kept=S.actions.filter(a=>a.status!=='selesai');
  let nEsc=0;
  kept.forEach(a=>{if(a.status==='eskalasi')a.counted=true;a.carry+=1;if(a.status==='terbuka'&&a.carry>=2){a.status='eskalasi';a.counted=true;H.actionsClosed++;nEsc++;}});
  S.actions=kept;S.good=[];
  S.handover.forEach(h=>h.ok=false);
  S.huddle={mode:T.mode,startedAt:null,finishedAt:null,duration:0,done:{},marks:{}};
  S.shift=(S.shift+1)%3;S.tab='beranda';UI.varOpen={};
  return{n:kept.length,esc:nEsc};
}

/* ---------- Aksi ---------- */
const A={
  go(el){S.tab=el.dataset.tab;commit(false);},
  step(el){const k=el.dataset.k,d=+el.dataset.d,l=S.load;
    if(k==='pasien'){l.pasien=clamp(l.pasien+d,1,99);if(l.tinggi>l.pasien)l.tinggi=l.pasien;}
    else if(k==='tinggi')l.tinggi=clamp(l.tinggi+d,0,l.pasien);
    else l.perawat=clamp(l.perawat+d,1,40);
    commit();},
  hand(el){const h=S.handover.find(x=>x.id===el.dataset.id);if(h)h.ok=!h.ok;commit();},
  bed(el){openSheet('bed',{id:el.dataset.id});},
  addbed(){openSheet('bed',{id:null});},
  savebed(el){
    const b=readBed(),err=$('#nb-err');
    if(!bedOk(b)){err.textContent='Lengkapi semua nilai dengan angka yang masuk akal.';return;}
    if(b.nm.length<3||b.rm.length<4){err.textContent='Isi nama lengkap dan nomor rekam medis.';return;}
    const id=el.dataset.id;
    if(id){Object.assign(S.beds.find(x=>x.id===id),{nm:b.nm,rm:b.rm,rr:b.rr,spo2:b.spo2,sbp:b.sbp,hr:b.hr,temp:b.temp,o2:b.o2,alert:b.alert});}
    else{if(!b.name){err.textContent='Isi nomor bed.';return;}S.beds.push({id:uid('b'),name:b.name,nm:b.nm,rm:b.rm,rr:b.rr,spo2:b.spo2,sbp:b.sbp,hr:b.hr,temp:b.temp,o2:b.o2,alert:b.alert});}
    closeSheet();commit();toast('Tanda vital tersimpan');},
  start(){const H=S.huddle;if(!H.startedAt&&!H.finishedAt)H.startedAt=Date.now();S.tab='agenda';commit(false);},
  mode(el){S.huddle.mode=el.dataset.m;commit();},
  qdone(el){const H=S.huddle,id=el.dataset.id;H.done[id]=!H.done[id];if(H.done[id]&&!H.startedAt&&!H.finishedAt)H.startedAt=Date.now();commit();},
  qvar(el){UI.varOpen[el.dataset.id]=!UI.varOpen[el.dataset.id];render(true);},
  qmark(el){const m=S.huddle.marks,id=el.dataset.id;if(m[id]===el.dataset.v)delete m[id];else m[id]=el.dataset.v;commit();},
  qact(el){const q=questions().find(x=>x.id===el.dataset.id);openSheet('action',{title:q?q.act:'',pid:q?q.pid:undefined});},
  finish(){const H=S.huddle;if(!H.startedAt)H.startedAt=Date.now();H.finishedAt=Date.now();H.duration=Math.max(0,Math.floor((H.finishedAt-H.startedAt)/1000));commit();toast('Huddle terdokumentasi');},
  astat(el){const a=S.actions.find(x=>x.id===el.dataset.id),s=el.dataset.s;if(!a)return;
    if(s==='selesai'&&a.pid&&!a.verifiedAt&&S.beds.some(b=>b.id===a.pid)){openSheet('verify',{id:a.id});return;}
    a.status=s;if(s==='terbuka')delete a.verifiedAt;commit();},
  doverify(el){const a=S.actions.find(x=>x.id===el.dataset.id);
    if(!$('#vf-chk').checked){$('#vf-err').textContent='Centang setelah nama dan nomor RM dicocokkan.';return;}
    if(a){a.status='selesai';a.verifiedAt=Date.now();}closeSheet();commit();toast('Tindakan selesai, pengenal dicocokkan');},
  mask(){S.mask=!S.mask;commit();},
  addaction(){openSheet('action',{});},
  saveaction(){
    const t=$('#sa-title').value.trim(),o=$('#sa-owner').value,d=$('#sa-due').value,err=$('#sa-err');
    if(t.length<3){err.textContent='Isi nama tindakan.';return;}
    if(!o||!d){err.textContent='Pilih pemilik dan isi tenggat. Tindakan tanpa pemilik atau tenggat tidak disimpan.';return;}
    S.actions.unshift({id:uid('a'),title:t,owner:o,due:d,status:'terbuka',carry:0,pid:$('#sa-pid').value||null});
    closeSheet();commit();toast('Tindakan ditambahkan');},
  gcat(el){UI.draft.cat=UI.draft.cat===el.dataset.v?'':el.dataset.v;UI.draft.err='';render(true);},
  gctx(el){const v=el.dataset.v,c=UI.draft.ctx,i=c.indexOf(v);if(i>=0)c.splice(i,1);else c.push(v);render(true);},
  savegood(){
    const d=UI.draft,t=d.text.trim();
    if(!d.cat){d.err='Pilih satu kategori.';render(true);return;}
    if(t.length<8){d.err='Tulis singkat apa yang berhasil.';render(true);return;}
    if(looksId(t)){d.err='Teks memuat nama atau nomor yang mirip identitas pasien. Catatan ini untuk pembelajaran unit, jadi hapus identitas lalu simpan.';render(true);return;}
    S.good.unshift({id:uid('g'),cat:d.cat,ctx:d.ctx.slice(),text:t,at:Date.now()});
    UI.draft={cat:'',ctx:[],text:'',err:''};commit();toast('Praktik baik tersimpan');},
  settings(){openSheet('settings');},
  map(){openSheet('map');},
  thr(el){S.threshold=clamp(Math.round((S.threshold+(+el.dataset.d))*2)/2,1,10);commit();},
  askreset(){UI.confirmReset=true;paintSheet();},
  noreset(){UI.confirmReset=false;paintSheet();},
  reset(){S=seed();UI.varOpen={};UI.draft={cat:'',ctx:[],text:'',err:''};closeSheet();commit(false);toast('Data contoh dipulihkan');},
  endshift(){openSheet('end');},
  doend(){closeSheet();const r=endShift();commit(false);toast(`Shift ${SHIFTS[S.shift]} dimulai. ${r.n} tindakan terbawa.`);},
  closesheet(){closeSheet();},
  backdrop(el,e){if(e.target===el)closeSheet();},
  export(){
    const txt=buildExport();
    const fallback=()=>openSheet('export',{text:txt});
    try{navigator.clipboard.writeText(txt).then(()=>toast('Ringkasan disalin'),fallback);}catch(e){fallback();}
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,e);});
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id.indexOf('nb-')===0)bedPreview();
  if(id==='g-text')UI.draft.text=e.target.value;
});
document.addEventListener('change',e=>{if((e.target.id||'').indexOf('nb-')===0)bedPreview();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)closeSheet();});

$('#btn-map').innerHTML=ico('map',22);
$('#btn-set').innerHTML=ico('gear',22);
setInterval(tick,1000);
render(false);
})();
</script>

</body></html>
